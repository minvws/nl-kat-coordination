name: "CodeQL OpenKAT"

on:
  push:
    branches:
      - "main"
      - "release-*"
  pull_request:
  schedule:
    # Weekly on Sunday.
    - cron: "30 1 * * 0"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ["ubuntu-latest"]
    permissions:
      # required for all workflows
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: actions
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended # Use security extended, when too many false positives we can switch back to default

      # Use the CodeQL tools for analyzing.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{matrix.language}}"
