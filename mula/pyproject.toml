[project]
name = "mula"
version = "0.0.1.dev1"
description = "OpenKAT's intelligent job scheduler"
authors = [{ name = "Stichting Librekat", email = "maintainer@librekat.nl" }]
requires-python = ">=3.10"
license = "EUPL-1.2"
dependencies = [
    "alembic>=1.12.1,<2",
    "croniter>=6.0.0,<7",
    "mmh3>=5.1.0,<6",
    "pika>=1.3.2,<2",
    "prometheus-client>=0.19.0,<0.20",
    "psycopg2-binary>=2.9.10",
    "pydantic>=2.11.3,<3",
    "pydantic-settings>=2.14.2,<3",
    "python-dotenv>=1.0.0,<2",
    "retry2>=0.9.5,<0.10",
    "sqlalchemy>=2.0.23,<3",
    "structlog>=25.2.0,<26",
    "uvicorn>=0.29.0,<0.30",
    "httpx>=0.28.1,<0.29",
    "fastapi-slim>=0.115.12",
    "opentelemetry-sdk",
    "opentelemetry-api",
    "opentelemetry-proto",
    "opentelemetry-exporter-otlp-proto-grpc",
    "opentelemetry-exporter-otlp-proto-common",
    "opentelemetry-util-http",
    "opentelemetry-instrumentation",
    "opentelemetry-instrumentation-httpx",
    "opentelemetry-instrumentation-asgi",
    "opentelemetry-instrumentation-dbapi",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-psycopg2",
    "opentelemetry-semantic-conventions",
    "pygments>=2.20.0",
    "wrapt>=2.1.2",
    "mako>=1.4.2",
    "idna>=3.15",
    "starlette>=1.3.1",
    "anyio>=4.14.2",
]

[dependency-groups]
dev = [
    "factory_boy>=3.2.1,<4",
    "click>=8.0.4,<9",
    "psutil>=7",
    "pytest>=9.0.3,<10",
    "pytest-cov>=7",
]

[tool.uv]
package = false

[tool.coverage.run]
relative_files = true

omit = [
    "scheduler/alembic/*",
    "scheduler/config/*",
    "scheduler/context/*",
    "scheduler/models/*",
    "scheduler/utils/*",
    "scheduler/__main__.py",
]

[tool.pytest.ini_options]
addopts = "--cov scheduler/ --cov-config=pyproject.toml --cov-report xml --cov-branch --cov-report=term-missing:skip-covered"
