[project]
name = "octopoes"
version = "0.0.1.dev1"
description = "OpenKAT's knowledge graph engine"
authors = [{ name = "Stichting LibreKAT", email = "maintainer@librekat.nl" }]
requires-python = ">=3.10"
license = { text = "EUPL-1.2" }
dependencies = [
    "pydantic>=2.7.1,<3",
    "uvicorn>=0.29.0,<0.30",
    "pika>=1.3.1,<2",
    "PyYAML~=6.0",
    "dnspython>=2.6.1,<3",
    "kombu>=5.2.4,<6",
    "celery>=5.2.7,<6",
    "pyparsing>=3.0.9,<4",
    "tldextract>5",
    "opentelemetry-sdk",
    "opentelemetry-instrumentation",
    "opentelemetry-exporter-otlp-proto-grpc",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-psycopg2",
    "opentelemetry-instrumentation-httpx",
    "sqlalchemy==1.4.48",
    "jsonschema>=4.18.0,<5",
    "pydantic-settings>=2.14.2,<3",
    "httpx>=0.28.1,<0.29",
    "link-shorteners>=1.11.0,<2",
    "opentelemetry-api",
    "opentelemetry-exporter-otlp-proto-common",
    "opentelemetry-instrumentation-asgi",
    "opentelemetry-instrumentation-dbapi",
    "opentelemetry-proto",
    "opentelemetry-semantic-conventions",
    "opentelemetry-util-http",
    "fastapi-slim>=0.115.2",
    "structlog>=25.2.0,<26",
    "asgiref>=3.8.1,<4",
    "setuptools>80,<82",
    "requests>=2.33.0,<3",
    "pygments>=2.20.0",
    "wrapt>=2.1.2",
    "attrs>=26.1.0",
    "urllib3>=2.8.0",
    "idna>=3.15",
    "webob>=1.8.10",
    "starlette>=1.3.1",
    "soupsieve>=2.9",
    "anyio>=4.14.2",
]

[dependency-groups]
dev = [
    "robotframework>=7.2.2,<8",
    "robotframework-requests>=0.9.7,<0.10",
    "robotframework-httplibrary>=0.4.2,<0.5",
    "pytest>=9.0.2,<10",
    "pytest-cov>=7",
    "pytest-mock>=3.14.0,<4",
    "pytest-env>=1.1.5,<2",
    "pytest-timeout>=2.4.0,<3",
    "pytest-httpx>=0.35.0",
]

[tool.uv]
package = false

[tool.coverage.run]
relative_files = true

[tool.pytest.ini_options]
addopts = "--cov --cov-report xml --cov-branch --cov-report=term-missing:skip-covered"
env = [
    "D:XTDB_URI=http://xtdb:3000",
    "D:QUEUE_URI=amqp://placeholder",
    "D:KATALOGUS_API=http://placeholder:8000",
]
