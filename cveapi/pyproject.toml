[project]
name = "cveapi"
version = "0.0.1.dev1"
description = "OpenKAT's CVE API"
authors = [{ name = "Stichting Librekat", email = "maintainer@librekat.nl" }]
license = { text = "EUPL-1.2" }
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.1",
    "idna>=3.15",
    "anyio>=4.14.2",
    "certifi>=2026.10.19",
]

[project.scripts]
cveapi = "cveapi:run"

[tool.uv]
package = false

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# cveapi is a single module, not a package: packages.find never picks it up,
# so without this the .deb ships /usr/bin/cveapi without the code it imports.
py-modules = ["cveapi"]
