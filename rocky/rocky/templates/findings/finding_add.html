{% extends "layouts/base.html" %}

{% load i18n %}
{% load static %}

{% block content %}
    {% include "header.html" %}

    <main id="main-content">
        <article>
            <div class="layout-form">
                <h1>{% translate "Add finding" %}</h1>
                <form action="{% app_url "finding_add" ooi=ooi %}"
                      method="post"
                      class="help">
                    {% csrf_token %}
                    {% include "partials/form/fieldset.html" with legend=fieldset_legend fields=form %}

                    <button type="submit">{% translate "Add finding" %}</button>
                </form>
            </div>
        </article>
    </main>
{% endblock content %}
