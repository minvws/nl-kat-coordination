{% load i18n %}

{% if perms.tools.can_enable_disable_boefje %}
    <form action="{% app_url "plugin_enable_disable" plugin_type=plugin.type plugin_id=plugin.id plugin_state=plugin.enabled temporal_context=None %}"
          method="post"
          class="inline">
        {% csrf_token %}
        <input type="hidden"
               name="current_url"
               value="{{ request.get_full_path }}#plugin_{{ plugin.id|slugify }}">
        <button type="submit"
                class="button ghost {% if plugin.enabled %}destructive{% else %}plugin-enabled{% endif %}">
            {% if not plugin.enabled %}
                {% translate "Enable" %}
            {% else %}
                {% translate "Disable" %}
            {% endif %}
        </button>
    </form>
{% else %}
    <span class="de-emphasized">
        {% if plugin.enabled %}
            <span class="label system-tag color-2">{% translate "Enabled" %}</span>
        {% else %}
            <span class="label system-tag color-3">{% translate "Disabled" %}</span>
        {% endif %}
    </span>
{% endif %}
