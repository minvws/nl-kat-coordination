<!doctype html><html><head><title>lodash vulnerabilities | Snyk</title></head><body><script nonce="/dF6sL504rr27lfbeiZT0lvd" type="application/json" data-nuxt-data="nuxt-app" data-ssr="true" id="__NUXT_DATA__">[["ShallowReactive",1],{"data":2,"state":1317,"once":1323,"_errors":1324,"serverRendered":40,"path":1326},["ShallowReactive",3],{"$fJArhnP4wgBR2gCHXxn4ckjHsH4Zofj5EPE1Xt3WUPFo":4,"package-data":672,"$fbMJjQvX3CbGxtD79MbsoEIiY65XtxJAU8lcM0LJQbJE":673,"package-metadata":1316},{"description":5,"vulnerabilities":6,"licenses":262,"latestReleaseVersion":270,"latestNonVulnerableVersion":16,"firstPublishedDate":272,"versions":273,"totalVersions":671},"Lodash modular utilities.",[7,31,58,77,94,115,133,148,172,193,211,232],{"id":8,"title":9,"description":10,"severity":11,"affectedVersions":12,"malicious":17,"cvssScore":18,"publicationTime":19,"identifiers":20,"vulnDescription":27},"SNYK-JS-LODASH-15869625","Arbitrary Code Injection","## Overview\n[lodash](https:\u002F\u002Fwww.npmjs.com\u002Fpackage\u002Flodash) is a modern JavaScript utility library delivering modularity, performance, & extras.\n\nAffected versions of this package are vulnerable to Arbitrary Code Injection due the improper validation of `options.imports` key names in `_.template`. An attacker can execute arbitrary code at template compilation time by injecting malicious expressions. If `Object.prototype` has been polluted, inherited properties may also be copied into the imports object and executed.\r\n\r\n**Notes:**\r\n\r\n1) Version 4.18.0 was intended to fix this vulnerability but it got deprecated due to introducing a breaking [functionality issue](https:\u002F\u002Fgithub.com\u002Flodash\u002Flodash\u002Fissues\u002F6167).\r\n\r\n2) This issue is due to the incomplete fix for [CVE-2021-23337](https:\u002F\u002Fsecurity.snyk.io\u002Fvuln\u002FSNYK-JS-LODASH-1040724).\n## Remediation\nUpgrade `lodash` to version 4.18.1 or higher.\n## References\n- [GitHub Advisory](https:\u002F\u002Fgithub.com\u002Flodash\u002Flodash\u002Fsecurity\u002Fadvisories\u002FGHSA-r5fr-rjxr-66jc)\n- [GitHub Commit](https:\u002F\u002Fgithub.com\u002Flodash\u002Flodash\u002Fcommit\u002F879aaa93132d78c2f8d20c60279da9f8b21576d6)\n- [GitHub Issue](https:\u002F\u002Fgithub.com\u002Flodash\u002Flodash\u002Fissues\u002F6167)\n- [OpenJS Security Advisory](https:\u002F\u002Fcna.openjsf.org\u002Fsecurity-advisories.html)\n","high",[13],{"min":14,"max":15},null,{"version":16,"inclusive":17},"4.18.1",false,8.6,"2026-04-01T10:32:00.027414Z",{"CVE":21,"CWE":23,"GHSA":25},[22],"CVE-2026-4800",[24],"CWE-94",[26],"GHSA-r5fr-rjxr-66jc",{"Overview":28,"Remediation":29,"References":30},"\u003Cp>\u003Ca href=\"https:\u002F\u002Fwww.npmjs.com\u002Fpackage\u002Flodash\">lodash\u003C\u002Fa> is a modern JavaScript utility library delivering modularity, performance, &amp; extras.\u003C\u002Fp>\n\u003Cp>Affected versions of this package are vulnerable to Arbitrary Code Injection due the improper validation of \u003Ccode>options.imports\u003C\u002Fcode> key names in \u003Ccode>_.template\u003C\u002Fcode>. An attacker can execute arbitrary code at template compilation time by injecting malicious expressions. If \u003Ccode>Object.prototype\u003C\u002Fcode> has been polluted, inherited properties may also be copied into the imports object and executed.\u003C\u002Fp>\n\u003Cp>\u003Cstrong>Notes:\u003C\u002Fstrong>\u003C\u002Fp>\n\u003Col>\n\u003Cli>\u003Cp>Version 4.18.0 was intended to fix this vulnerability but it got deprecated due to introducing a breaking \u003Ca href=\"https:\u002F\u002Fgithub.com\u002Flodash\u002Flodash\u002Fissues\u002F6167\">functionality issue\u003C\u002Fa>.\u003C\u002Fp>\n\u003C\u002Fli>\n\u003Cli>\u003Cp>This issue is due to the incomplete fix for \u003Ca href=\"https:\u002F\u002Fsecurity.snyk.io\u002Fvuln\u002FSNYK-JS-LODASH-1040724\">CVE-2021-23337\u003C\u002Fa>.\u003C\u002Fp>\n\u003C\u002Fli>\n\u003C\u002Fol>\n","\u003Cp>Upgrade \u003Ccode>lodash\u003C\u002Fcode> to version 4.18.1 or higher.\u003C\u002Fp>\n","\u003Cul>\n\u003Cli>\u003Ca href=\"https:\u002F\u002Fgithub.com\u002Flodash\u002Flodash\u002Fsecurity\u002Fadvisories\u002FGHSA-r5fr-rjxr-66jc\">GitHub Advisory\u003C\u002Fa>\u003C\u002Fli>\n\u003Cli>\u003Ca href=\"https:\u002F\u002Fgithub.com\u002Flodash\u002Flodash\u002Fcommit\u002F879aaa93132d78c2f8d20c60279da9f8b21576d6\">GitHub Commit\u003C\u002Fa>\u003C\u002Fli>\n\u003Cli>\u003Ca href=\"https:\u002F\u002Fgithub.com\u002Flodash\u002Flodash\u002Fissues\u002F6167\">GitHub Issue\u003C\u002Fa>\u003C\u002Fli>\n\u003Cli>\u003Ca href=\"https:\u002F\u002Fcna.openjsf.org\u002Fsecurity-advisories.html\">OpenJS Security Advisory\u003C\u002Fa>\u003C\u002Fli>\n\u003C\u002Ful>\n",{"id":32,"title":33,"description":34,"severity":35,"affectedVersions":36,"malicious":17,"cvssScore":42,"publicationTime":43,"identifiers":44,"vulnDescription":51},"SNYK-JS-LODASH-15869619","Prototype Pollution","## Overview\n[lodash](https:\u002F\u002Fwww.npmjs.com\u002Fpackage\u002Flodash) is a modern JavaScript utility library delivering modularity, performance, & extras.\n\nAffected versions of this package are vulnerable to Prototype Pollution via the `_.unset` and `_.omit` functions. An attacker can delete properties from built-in prototypes by supplying array-wrapped path segments, potentially impacting application behaviour.\r\n\r\n**Notes:**\r\n\r\n1) Version 4.18.0 was intended to fix this vulnerability but it got deprecated due to introducing a breaking [functionality issue](https:\u002F\u002Fgithub.com\u002Flodash\u002Flodash\u002Fissues\u002F6167).\r\n\r\n2) This issue is due to incomplete fix for [CVE-2025-13465](https:\u002F\u002Fsecurity.snyk.io\u002Fvuln\u002FSNYK-JS-LODASH-15053838) which protects only against string key members.\n\n## Details\n\nPrototype Pollution is a vulnerability affecting JavaScript. Prototype Pollution refers to the ability to inject properties into existing JavaScript language construct prototypes, such as objects. JavaScript allows all Object attributes to be altered, including their magical attributes such as `__proto__`, `constructor` and `prototype`. An attacker manipulates these attributes to overwrite, or pollute, a JavaScript application object prototype of the base object by injecting other values.  Properties on the `Object.prototype` are then inherited by all the JavaScript objects through the prototype chain. When that happens, this leads to either denial of service by triggering JavaScript exceptions, or it tampers with the application source code to force the code path that the attacker injects, thereby leading to remote code execution.\n\nThere are two main ways in which the pollution of prototypes occurs:\n\n-   Unsafe `Object` recursive merge\n    \n-   Property definition by path\n    \n\n### Unsafe Object recursive merge\n\nThe logic of a vulnerable recursive merge function follows the following high-level model:\n```\nmerge (target, source)\n\n  foreach property of source\n\n    if property exists and is an object on both the target and the source\n\n      merge(target[property], source[property])\n\n    else\n\n      target[property] = source[property]\n```\n\u003Cbr>  \n\nWhen the source object contains a property named `__proto__` defined with `Object.defineProperty()` , the condition that checks if the property exists and is an object on both the target and the source passes and the merge recurses with the target, being the prototype of `Object` and the source of `Object` as defined by the attacker. Properties are then copied on the `Object` prototype.\n\nClone operations are a special sub-class of unsafe recursive merges, which occur when a recursive merge is conducted on an empty object: `merge({},source)`.\n\n`lodash` and `Hoek` are examples of libraries susceptible to recursive merge attacks.\n\n### Property definition by path\n\nThere are a few JavaScript libraries that use an API to define property values on an object based on a given path. The function that is generally affected contains this signature: `theFunction(object, path, value)`\n\nIf the attacker can control the value of “path”, they can set this value to `__proto__.myValue`. `myValue` is then assigned to the prototype of the class of the object.\n\n## Types of attacks\n\nThere are a few methods by which Prototype Pollution can be manipulated:\n\n| Type |Origin  |Short description |\n|--|--|--|\n| **Denial of service (DoS)**|Client  |This is the most likely attack. \u003Cbr>DoS occurs when `Object` holds generic functions that are implicitly called for various operations (for example, `toString` and `valueOf`). \u003Cbr> The attacker pollutes `Object.prototype.someattr` and alters its state to an unexpected value such as `Int` or `Object`. In this case, the code fails and is likely to cause a denial of service.  \u003Cbr>**For example:** if an attacker pollutes `Object.prototype.toString` by defining it as an integer, if the codebase at any point was reliant on `someobject.toString()` it would fail. |\n |**Remote Code Execution**|Client|Remote code execution is generally only possible in cases where the codebase evaluates a specific attribute of an object, and then executes that evaluation.\u003Cbr>**For example:** `eval(someobject.someattr)`. In this case, if the attacker pollutes `Object.prototype.someattr` they are likely to be able to leverage this in order to execute code.|\n|**Property Injection**|Client|The attacker pollutes properties that the codebase relies on for their informative value, including security properties such as cookies or tokens.\u003Cbr>  **For example:** if a codebase checks privileges for `someuser.isAdmin`, then when the attacker pollutes `Object.prototype.isAdmin` and sets it to equal `true`, they can then achieve admin privileges.|\n\n## Affected environments\n\nThe following environments are susceptible to a Prototype Pollution attack:\n\n-   Application server\n    \n-   Web server\n\n-   Web browser\n    \n\n## How to prevent\n\n1.  Freeze the prototype— use `Object.freeze (Object.prototype)`.\n    \n2.  Require schema validation of JSON input.\n    \n3.  Avoid using unsafe recursive merge functions.\n    \n4.  Consider using objects without prototypes (for example, `Object.create(null)`), breaking the prototype chain and preventing pollution.\n    \n5.  As a best practice use `Map` instead of `Object`.\n\n### For more information on this vulnerability type:\n\n[Arteau, Olivier. “JavaScript prototype pollution attack in NodeJS application.” GitHub, 26 May 2018](https:\u002F\u002Fgithub.com\u002FHoLyVieR\u002Fprototype-pollution-nsec18\u002Fblob\u002Fmaster\u002Fpaper\u002FJavaScript_prototype_pollution_attack_in_NodeJS.pdf)\n\n## Remediation\nUpgrade `lodash` to version 4.18.1 or higher.\n## References\n- [GitHub Advisory](https:\u002F\u002Fgithub.com\u002Flodash\u002Flodash\u002Fsecurity\u002Fadvisories\u002FGHSA-f23m-r3pf-42rh)\n- [GitHub Commit](https:\u002F\u002Fgithub.com\u002Flodash\u002Flodash\u002Fcommit\u002Ffe8d32eda854377349a4f922ab7655c8e5df9a0b)\n- [GitHub Issue](https:\u002F\u002Fgithub.com\u002Flodash\u002Flodash\u002Fissues\u002F6167)\n","medium",[37],{"min":38,"max":41},{"version":39,"inclusive":40},"4.0.0",true,{"version":16,"inclusive":17},6.9,"2026-04-01T10:06:10.804459Z",{"CVE":45,"CWE":47,"GHSA":49},[46],"CVE-2026-2950",[48],"CWE-1321",[50],"GHSA-f23m-r3pf-42rh",{"Overview":52,"Details":53,"Types of attacks":54,"Affected environments":55,"How to prevent":56,"Remediation":29,"References":57},"\u003Cp>\u003Ca href=\"https:\u002F\u002Fwww.npmjs.com\u002Fpackage\u002Flodash\">lodash\u003C\u002Fa> is a modern JavaScript utility library delivering modularity, performance, &amp; extras.\u003C\u002Fp>\n\u003Cp>Affected versions of this package are vulnerable to Prototype Pollution via the \u003Ccode>_.unset\u003C\u002Fcode> and \u003Ccode>_.omit\u003C\u002Fcode> functions. An attacker can delete properties from built-in prototypes by supplying array-wrapped path segments, potentially impacting application behaviour.\u003C\u002Fp>\n\u003Cp>\u003Cstrong>Notes:\u003C\u002Fstrong>\u003C\u002Fp>\n\u003Col>\n\u003Cli>\u003Cp>Version 4.18.0 was intended to fix this vulnerability but it got deprecated due to introducing a breaking \u003Ca href=\"https:\u002F\u002Fgithub.com\u002Flodash\u002Flodash\u002Fissues\u002F6167\">functionality issue\u003C\u002Fa>.\u003C\u002Fp>\n\u003C\u002Fli>\n\u003Cli>\u003Cp>This issue is due to incomplete fix for \u003Ca href=\"https:\u002F\u002Fsecurity.snyk.io\u002Fvuln\u002FSNYK-JS-LODASH-15053838\">CVE-2025-13465\u003C\u002Fa> which protects only against string key members.\u003C\u002Fp>\n\u003C\u002Fli>\n\u003C\u002Fol>\n","\u003Cp>Prototype Pollution is a vulnerability affecting JavaScript. Prototype Pollution refers to the ability to inject properties into existing JavaScript language construct prototypes, such as objects. JavaScript allows all Object attributes to be altered, including their magical attributes such as \u003Ccode>__proto__\u003C\u002Fcode>, \u003Ccode>constructor\u003C\u002Fcode> and \u003Ccode>prototype\u003C\u002Fcode>. An attacker manipulates these attributes to overwrite, or pollute, a JavaScript application object prototype of the base object by injecting other values.  Properties on the \u003Ccode>Object.prototype\u003C\u002Fcode> are then inherited by all the JavaScript objects through the prototype chain. When that happens, this leads to either denial of service by triggering JavaScript exceptions, or it tampers with the application source code to force the code path that the attacker injects, thereby leading to remote code execution.\u003C\u002Fp>\n\u003Cp>There are two main ways in which the pollution of prototypes occurs:\u003C\u002Fp>\n\u003Cul>\n\u003Cli>\u003Cp>Unsafe \u003Ccode>Object\u003C\u002Fcode> recursive merge\u003C\u002Fp>\n\u003C\u002Fli>\n\u003Cli>\u003Cp>Property definition by path\u003C\u002Fp>\n\u003C\u002Fli>\n\u003C\u002Ful>\n\u003Ch3>Unsafe Object recursive merge\ 003C\u002Fp>\n\u003Ctable>\n\u003Cthead>\n\u003Ctr>\n\u003Cth>Type\u003C\u002Fth>\n\u003Cth>Origin\u003C\u002Fth>\n\u003Cth>Short description\u003C\u002Fth>\n\u003C\u002Ftr>\n\u003C\u002Fthead>\n\u003Ctbody>\u003Ctr>\n\u003Ctd>\u003Cstrong>Denial of service (DoS)\u003C\u002Fstrong>\u003C\u002Ftd>\n\u003Ctd>Client\u003C\u002Ftd>\n\u003Ctd>This is the most likely attack. \u003Cbr>DoS occurs when \u003Ccode>Object\u003C\u002Fcode> holds generic functions that are implicitly called for various operations (for example, \u003Ccode>toString\u003C\u002Fcode> and \u003Ccode>valueOf\u003C\u002Fcode>). \u003Cbr> The attacker pollutes \u003Ccode>Object.prototype.someattr\u003C\u002Fcode> and alters its state to an unexpected value such as \u003Ccode>Int\u003C\u002Fcode> or \u003Ccode>Object\u003C\u002Fcode>. In this case, the code fails and is likely to cause a denial of service.  \u003Cbr>\u003Cstrong>For example:\u003C\u002Fstrong> if an attacker pollutes \u003Ccode>Object.prototype.toString\u003C\u002Fcode> by defining it as an integer, if the codebase at any point was reliant on \u003Ccode>someobject.toString()\u003C\u002Fcode> it would fail.\u003C\u002Ftd>\n\u003C\u002Ftr>\n\u003Ctr>\n\u003Ctd>\u003Cstrong>Remote Code Execution\u003C\u002Fstrong>\u003C\u002Ftd>\n\u003Ctd>Client\u003C\u002Ftd>\n\u003Ctd>Remote code execution is generally only possible in cases where the codebase evaluates a specific attribute of an object, and then executes that evaluation.\u003Cbr>\u003Cstrong>For example:\u003C\u002Fstrong> \u003Ccode>eval(someobject.someattr)\u003C\u002Fcode>. In this case, if the attacker pollutes \u003Ccode>Object.prototype.someattr\u003C\u002Fcode> they are likely to be able to leverage this in order to execute code.\u003C\u002Ftd>\n\u003C\u002Ftr>\n\u003Ctr>\n\u003Ctd>\u003Cstrong>Property Injection\u003C\u002Fstrong>\u003C\u002Ftd>\n\u003Ctd>Client\u003C\u002Ftd>\n\u003Ctd>The attacker pollutes properties that the codebase relies on for their informative value, including security properties such as cookies or tokens.\u003Cbr>  \u003Cstrong>For example:\u003C\u002Fstrong> if a codebase checks privileges for \u003Ccode>someuser.isAdmin\u003C\u002Fcode>, then when the attacker pollutes \u003Ccode>Object.prototype.isAdmin\u003C\u002Fcode> and sets it to equal \u003Ccode>true\u003C\u002Fcode>, they can then achieve admin privileges.\u003C\u002Ftd>\n\u003C\u002Ftr>\n\u003C\u002Ftbody>\u003C\u002Ftable>\n","\u003Cp>The following environments are susceptible to a Prototype Pollution attack:\u003C\u002Fp>\n\u003Cul>\n\u003Cli>\u003Cp>Application server\u003C\u002Fp>\n\u003C\u002Fli>\n\u003Cli>\u003Cp>Web server\u003C\u002Fp>\n\u003C\u002Fli>\n\u003Cli>\u003Cp>Web browser\u003C\u002Fp>\n\u003C\u002Fli>\n\u003C\u002Ful>\n","\u003Col>\n\u003Cli>\u003Cp>Freeze the prototype— use \u003Ccode>Object.freeze (Object.prototype)\u003C\u002Fcode>.\u003C\u002Fp>\n\u003C\u002Fli>\n\u003Cli>\u003Cp>Require schema validation of JSON input.\u003C\u002Fp>\n\u003C\u002Fli>\n\u003Cli>\u003Cp>Avoid using unsafe recursive merge functions.\u003C\u002Fp>\n\u003C\u002Fli>\n\u003Cli>\u003Cp>Consider using objects without prototypes (for example, \u003Ccode>Object.create(null)\u003C\u002Fcode>), breaking the prototype chain and preventing pollution.\u003C\u002Fp>\n\u003C\u002Fli>\n\u003Cli>\u003Cp>As a best practice use \u003Ccode>Map\u003C\u002Fcode> instead of \u003Ccode>Object\u003C\u002Fcode>.\u003C\u002Fp>\n\u003C\u002Fli>\n\u003C\u002Fol>\n\u003Ch3>For more information on this vulnerability type:\u003C\u002Fh3>\n\u003Cp>\u003Ca href=\"https:\u002F\u002Fgithub.com\u002FHoLyVieR\u002Fprototype-pollution-nsec18\u002Fblob\u002Fmaster\u002Fpaper\u002FJavaScript_prototype_pollution_attack_in_NodeJS.pdf\">Arteau, Olivier. “JavaScript prototype pollution attack in NodeJS application.” GitHub, 26 May 2018\u003C\u002Fa>\u003C\u002Fp>\n","\u003Cul>\n\u003Cli>\u003Ca href=\"https:\u002F\u002Fgithub.com\u002Flodash\u002Flodash\u002Fsecurity\u002Fadvisories\u002FGHSA-f23m-r3pf-42rh\">GitHub Advisory\u003C\u002Fa>\u003C\u002Fli>\n\u003Cli>\u003Ca href=\"https:\u002F\u002Fgithub.com\u002Flodash\u002Flodash\u002Fcommit\u002Ffe8d32eda854377349a4f922ab7655c8e5df9a0b\">GitHub Commit\u003C\u002Fa>\u003C\u002Fli>\n\u003Cli>\u003Ca href=\"https:\u002F\u002Fgithub.com\u002Flodash\u002Flodash\u002Fissues\u002F6167\">GitHub Issue\u003C\u002Fa>\u003C\u002Fli>\n\u003C\u002Ful>\n",{"id":59,"title":33,"description":60,"severity":35,"affectedVersions":61,"malicious":17,"cvssScore":42,"publicationTime":66,"identifiers":67,"vulnDescription":73},"SNYK-JS-LODASH-15053838","## Overview\n[lodash](https:\u002F\u002Fwww.npmjs.com\u002Fpackage\u002Flodash) is a modern JavaScript utility library delivering modularity, performance, & extras.\n\nAffected versions of this package are vulnerable to Prototype Pollution via the `_.unset` and `_.omit` functions. An attacker can delete methods held in properties of global prototypes but cannot overwrite those properties.\n\n## Details\n\nPrototype Pollution is a vulnerability affecting JavaScript. Prototype Pollution refers to the ability to inject properties into existing JavaScript language construct prototypes, such as objects. JavaScript allows all Object attributes to be altered, including their magical attributes such as `__proto__`, `constructor` and `prototype`. An attacker manipulates these attributes to overwrite, or pollute, a JavaScript application object prototype of the base object by injecting other values.  Properties on the `Object.prototype` are then inherited by all the JavaScript objects through the prototype chain. When that happens, this leads to either denial of service by triggering JavaScript exceptions, or it tampers with the application source code to force the code path that the attacker injects, thereby leading to remote code execution.\n\nThere are two main ways in which the pollution of prototypes occurs:\n\n-   Unsafe `Object` recursive merge\n    \n-   Property definition by path\n    \n\n### Unsafe Object recursive merge\n\nThe logic of a vulnerable recursive merge function follows the following high-level model:\n```\nmerge (target, source)\n\n  foreach property of source\n\n    if property exists and is an object on both the target and the source\n\n      merge(target[property], source[property])\n\n    else\n\n      target[property] = source[property]\n```\n\u003Cbr>  \n\nWhen the source object contains a property named `__proto__` defined with `Object.defineProperty()` , the condition that checks if the property exists and is an object on both the target and the source passes and the merge recurses with the target, being the prototype of `Object` and the source of `Object` as defined by the attacker. Properties are then copied on the `Object` prototype.\n\nClone operations are a special sub-class of unsafe recursive merges, which occur when a recursive merge is conducted on an empty object: `merge({},source)`.\n\n`lodash` and `Hoek` are examples of libraries susceptible to recursive merge attacks.\n\n### Property definition by path\n\nThere are a few JavaScript libraries that use an API to define property values on an object based on a given path. The function that is generally affected contains this signature: `theFunction(object, path, value)`\n\nIf the attacker can control the value of “path”, they can set this value to `__proto__.myValue`. `myValue` is then assigned to the prototype of the class of the object.\n\n## Types of attacks\n\nThere are a few methods by which Prototype Pollution can be manipulated:\n\n| Type |Origin  |Short description |\n|--|--|--|\n| **Denial of service (DoS)**|Client  |This is the most likely attack. \u003Cbr>DoS occurs when `Object` holds generic functions that are implicitly called for various operations (for example, `toString` and `valueOf`). \u003Cbr> The attacker pollutes `Object.prototype.someattr` and alters its state to an unexpected value such as `Int` or `Object`. In this case, the code fails and is likely to cause a denial of service.  \u003Cbr>**For example:** if an attacker pollutes `Object.prototype.toString` by defining it as an integer, if the codebase at any point was reliant on `someobject.toString()` it would fail. |\n |**Remote Code Execution**|Client|Remote code execution is generally only possible in cases where the codebase evaluates a specific attribute of an object, and then executes that evaluation.\u003Cbr>**For example:** `eval(someobject.someattr)`. In this case, if the attacker pollutes `Object.prototype.someattr` they are likely to be able to leverage this in order to execute code.|\n|**Property Injection**|Client|The attacker pollutes properties that the codebase relies on for their informative value, including security properties such as cookies or tokens.\u003Cbr>  **For example:** if a codebase checks privileges for `someuser.isAdmin`, then when the attacker pollutes `Object.prototype.isAdmin` and sets it to equal `true`, they can then achieve admin privileges.|\n\n## Affected environments\n\nThe following environments are susceptible to a Prototype Pollution attack:\n\n-   Application server\n    \n-   Web server\n\n-   Web browser\n    \n\n## How to prevent\n\n1.  Freeze the prototype— use `Object.freeze (Object.prototype)`.\n    \n2.  Require schema validation of JSON input.\n    \n3.  Avoid using unsafe recursive merge functions.\n    \n4.  Consider using objects without prototypes (for example, `Object.create(null)`), breaking the prototype chain and preventing pollution.\n    \n5.  As a best practice use `Map` instead of `Object`.\n\n### For more information on this vulnerability type:\n\n[Arteau, Olivier. “JavaScript prototype pollution attack in NodeJS application.” GitHub, 26 May 2018](https:\u002F\u002Fgithub.com\u002FHoLyVieR\u002Fprototype-pollution-nsec18\u002Fblob\u002Fmaster\u002Fpaper\u002FJavaScript_prototype_pollution_attack_in_NodeJS.pdf)\n\n## Remediation\nUpgrade `lodash` to version 4.17.23 or higher.\n## References\n- [GitHub Commit](https:\u002F\u002Fgithub.com\u002Flodash\u002Flodash\u002Fcommit\u002Fedadd452146f7e4bad4ea684e955708931d84d81)\n",[62],{"min":63,"max":64},{"version":39,"inclusive":40},{"version":65,"inclusive":17},"4.17.23","2026-01-22T07:08:27.179012Z",{"CVE":68,"CWE":70,"GHSA":71},[69],"CVE-2025-13465",[48],[72],"GHSA-xxjr-mmjv-4gpg",{"Overview":74,"Details":53,"Types of attacks":54,"Affected environments":55,"How to prevent":56,"Remediation":75,"References":76},"\u003Cp>\u003Ca href=\"https:\u002F\u002Fwww.npmjs.com\u002Fpackage\u002Flodash\">lodash\u003C\u002Fa> is a modern JavaScript utility library delivering modularity, performance, &amp; extras.\u003C\u002Fp>\n\u003Cp>Affected versions of this package are vulnerable to Prototype Pollution via the \u003Ccode>_.unset\u003C\u002Fcode> and \u003Ccode>_.omit\u003C\u002Fcode> functions. An attacker can delete methods held in properties of global prototypes but cannot overwrite those properties.\u003C\u002Fp>\n","\u003Cp>Upgrade \u003Ccode>lodash\u003C\u002Fcode> to version 4.17.23 or higher.\u003C\u002Fp>\n","\u003Cul>\n\u003Cli>\u003Ca href=\"https:\u002F\u002Fgithub.com\u002Flodash\u002Flodash\u002Fcommit\u002Fedadd452146f7e4bad4ea684e955708931d84d81\">GitHub Commit\u003C\u002Fa>\u003C\u002Fli>\n\u003C\u002Ful>\n",{"id":78,"title":33,"description":79,"severity":11,"affectedVersions":80,"malicious":17,"cvssScore":84,"publicationTime":85,"identifiers":86,"vulnDescription":89},"SNYK-JS-LODASH-6139239","## Overview\n[lodash](https:\u002F\u002Fwww.npmjs.com\u002Fpackage\u002Flodash) is a modern JavaScript utility library delivering modularity, performance, & extras.\n\nAffected versions of this package are vulnerable to Prototype Pollution through the `zipObjectDeep` function due to improper user input sanitization in the `baseZipObject` function.\n## PoC\n**lodash.zipobjectdeep:**\r\n\r\n```js\r\nconst zipObjectDeep = require(\"lodash.zipobjectdeep\");\r\n\r\nlet emptyObject = {};\r\n\r\n\r\nconsole.log(` example:** if an attacker pollutes `Object.prototype.toString` by defining it as an integer, if the codebase at any point was reliant on `someobject.toString()` it would fail. |\n |**Remote Code Execution**|Client|Remote code execution is generally only possible in cases where the codebase evaluates a specific attribute of an object, and then executes that evaluation.\u003Cbr>**For example:** `eval(someobject.someattr)`. In this case, if the attacker pollutes `Object.prototype.someattr` they are likely to be able to leverage this in order to execute code.|\n|**Property Injection**|Client|The attacker pollutes properties that the codebase relies on for their informative value, including security properties such as cookies or tokens.\u003Cbr>  **For example:** if a codebase checks privileges for `someuser.isAdmin`, then when the attacker pollutes `Object.prototype.isAdmin` and sets it to equal `true`, they can then achieve admin privileges.|\n\n## Affected environments\n\nThe following environments are susceptible to a Prototype Pollution attack:\n\n-   Application server\n    \n-   Web server\n\n-   Web browser\n    \n\n## How to prevent\n\n1.  Freeze the prototype— use `Object.freeze (Object.prototype)`.\n    \n2.  Require schema validation of JSON input.\n    \n3.  Avoid using unsafe recursive merge functions.\n    \n4.  Consider using objects without prototypes (for example, `Object.create(null)`), breaking the prototype chain and preventing pollution.\n    \n5.  As a best practice use `Map` instead of `Object`.\n\n### For more information on this vulnerability type:\n\n[Arteau, Olivier. “JavaScript prototype pollution attack in NodeJS application.” GitHub, 26 May 2018](https:\u002F\u002Fgithub.com\u002FHoLyVieR\u002Fprototype-pollution-nsec18\u002Fblob\u002Fmaster\u002Fpaper\u002FJavaScript_prototype_pollution_attack_in_NodeJS.pdf)\n\n## Remediation\nUpgrade `lodash` to version 4.17.17 or higher.\n## References\n- [GitHub Gist](https:\u002F\u002Fgist.github.com\u e]);\n\u002F\u002Fwe inject our malicious attributes in the vulnerable function\n\nconsole.log(`[+] After prototype pollution : ${emptyObject.polluted}`);\n\u002F\u002F[+] After prototype pollution : true\n\u003C\u002Fcode>\u003C\u002Fpre>\n","\u003Cp>Upgrade \u003Ccode>lodash\u003C\u002Fcode> to version 4.17.17 or higher.\u003C\u002Fp>\n","\u003Cul>\n\u003Cli>\u003Ca href=\"https:\u002F\u002Fgist.github.com\u002FSampaguitas\u002Fa316bced4fdd501146b07997d1d04eb2\">GitHub Gist\u003C\u002Fa>\u003C\u002Fli>\n\u003Cli>\u003Ca href=\"https:\u002F\u002Fgithub.com\u002Flodash\u002Flodash\u002Fblob\u002Faaa111912cb05e6f0f9f23d1eb8a41ccfcf9c2c2\u002Flodash.zipobjectdeep\u002Findex.js#L738\">Vulnerable Code\u003C\u002Fa>\u003C\u002Fli>\n\u003C\u002Ful>\n",{"id":95,"title":96,"description":97,"severity":11,"affectedVersions":98,"malicious":17,"cvssScore":102,"publicationTime":103,"identifiers":104,"vulnDescription":110},"SNYK-JS-LODASH-1040724","Code Injection","## Overview\n[lodash](https:\u002F\u002Fwww.npmjs.com\u002Fpackage\u002Flodash) is a modern JavaScript utility library delivering modularity, performance, & extras.\n\nAffected versions of this package are vulnerable to Code Injection due the improper validation of `options.variable` key names in `_.template`. An attacker can execute arbitrary code at template compilation time by injecting malicious expressions. If `Object.prototype` has been polluted, inherited properties may also be copied into the imports object and executed.\n## PoC\n```js\r\nvar _ = require('lodash');\r\n\r\n_.template('', { variable: '){console.log(process.env)}; with(obj' })()\r\n```\n## Remediation\nUpgrade `lodash` to version 4.17.21 or higher.\n## References\n- [GitHub Commit](https:\u002F\u002Fgithub.com\u002Flodash\u002Flodash\u002Fcommit\u002F3469357cff396a26c363f8c1b5a91dde28ba4b1c)\n- [Vulnerable Code](https:\u002F\u002Fgithub.com\u002Flodash\u002Flodash\u002Fblob\u002Fddfd9b11a0126db2302cb70ec9973b66baec0975\u002Flodash.js#L14851)\n- [Nuclei Templates](https:\u002F\u002Fgithub.com\u002Fprojectdiscovery\u002Fnuclei-templates\u002Fblob\u002Fmain\u002Fhttp\u002Fcves\u002F2021\u002FCVE-2021-23337.yaml)\n",[99],{"min":14,"max":100},{"version":101,"inclusive":17},"4.17.21",7.2,"2021-02-15T11:50:50Z",{"CVE":105,"CWE":107,"GHSA":108},[106],"CVE-2021-23337",[24],[109],"GHSA-35jh-r3h4-6jhm",{"Overview":111,"PoC":112,"Remediation":113,"References":114},"\u003Cp>\u003Ca href=\"https:\u002F\u002Fwww.npmjs.com\u002Fpackage\u002Flodash\">lodash\u003C\u002Fa> is a modern JavaScript utility library delivering modularity, performance, &amp; extras.\u003C\u002Fp>\n\u003Cp>Affected versions of this package are vulnerable to Code Injection due the improper validation of \u003Ccode>options.variable\u003C\u002Fcode> key names in \u003Ccode>_.template\u003C\u002Fcode>. An attacker can execute arbitrary code at template compilation time by injecting malicious expressions. If \u003Ccode>Object.prototype\u003C\u002Fcode> has been polluted, inherited properties may also be copied into the imports object and executed.\u003C\u002Fp>\n","\u003Cpre>\u003Ccode class=\"language-js\">var _ = require(&#39;lodash&#39;);\n\n_.template(&#39;&#39;, { variable: &#39;){console.log(process.env)}; with(obj&#39; })()\n\u003C\u002Fcode>\u003C\u002Fpre>\n","\u003Cp>Upgrade \u003Ccode>lodash\u003C\u002Fcode> to version 4.17.21 or higher.\u003C\u002Fp>\n","\u003Cul>\n\u003Cli>\u003Ca href=\"https:\u002F\u002Fgithub.com\u002Flodash\u002Flodash\u002Fcommit\u002F3469357cff396a26c363f8c1b5a91dde28ba4b1c\">GitHub Commit\u003C\u002Fa>\u003C\u002Fli>\n\u003Cli>\u003Ca href=\"https:\u002F\u002Fgithub.com\u002Flodash\u002Flodash\u002Fblob\u002Fddfd9b11a0126db2302cb70ec9973b66baec0975\u002Flodash.js#L14851\">Vulnerable Code\u003C\u002Fa>\u003C\u002Fli>\n\u003Cli>\u003Ca href=\"https:\u002F\u002Fgithub.com\u002Fprojectdiscovery\u002Fnuclei-templates\u002Fblob\u002Fmain\u002Fhttp\u002Fcves\u002F2021\u002FCVE-2021-23337.yaml\">Nuclei Templates\u003C\u002Fa>\u003C\u002Fli>\n\u003C\u002Ful>\n",{"id":116,"title":117,"description":118,"severity":35,"affectedVersions":119,"malicious":17,"cvssScore":122,"publicationTime":123,"identifiers":124,"vulnDescription":129},"SNYK-JS-LODASH-1018905","Regular Expression Denial of Service (ReDoS)","## Overview\n[lodash](https:\u002F\u002Fwww.npmjs.com\u002Fpackage\u002Flodash) is a modern JavaScript utility library delivering modularity, performance, & extras.\n\nAffected versions of this package are vulnerable to Regular Expression Denial of Service (ReDoS) via the `toNumber`, `trim` and `trimEnd` functions.\r\n\r\n### POC\r\n```\r\nvar lo = require('lodash');\r\n\r\nfunction build_blank (n) {\r\nvar ret = \"1\"\r\nfor (var i = 0; i \u003C n; i++) {\r\nret += \" \"\r\n}\r\n\r\nreturn ret + \"1\";\r\n}\r\n\r\nvar s = build_blank(50000)\r\nvar time0 = Date.now();\r\nlo.trim(s)\r\nvar time_cost0 = Date.now() - time0;\r\nconsole.log(\"time_cost0: \" + time_cost0)\r\n\r\nvar time1 = Date.now();\r\nlo.toNumber(s)\r\nvar time_cost1 = Date.now() - time1;\r\nconsole.log(\"time_cost1: \" + time_cost1)\r\n\r\nvar time2 = Date.now();\r\nlo.trimEnd(s)\r\nvar time_cost2 = Date.now() - time2;\r\nconsole.log(\"time_cost2: \" + time_cost2)\r\n```\n\n## Details\n\nDenial of Service (DoS) describes a family of attacks, all aimed at making a system inaccessible to its original and legitimate users. There are many types of DoS attacks, ranging from trying to clog the network pipes to the system by generating a large volume of traffic from many machines (a Distributed Denial of Service - DDoS - attack) to sending crafted requests that cause a system to crash or take a disproportional amount of time to process.\n\nThe Regular expression Denial of Service (ReDoS) is a type of Denial of Service attack. Regular expressions are incredibly powerful, but they aren't very intuitive and can ultimately end up making it easy for attackers to take your site down.\n\nLet’s take the following regular expression as an example:\n```js\nregex = \u002FA(B|C+)+D\u002F\n```\n\nThis regular expression accomplishes the following:\n- `A` The string must start with the letter 'A'\n- `(B|C+)+` The string must then follow the letter A with either the letter 'B' or some number of occurrences of the letter 'C' (the `+` matches one or more times). The `+` at the end of this section states that we can look for one or more matches of this section.\n- `D` Finally, we ensure this section of the string ends with a 'D'\n\nThe expression would match inputs such as `ABBD`, `ABCCCCD`, `ABCBCCCD` and `ACCCCCD`\n\nIt most cases, it doesn't take very long for a regex engine to find a match:\n\n```bash\n$ time node -e '\u002FA(B|C+)+D\u002F.test(\"ACCCCCCCCCCCCCCCCCCCCCCCCCCCCD\")'\n0.04s user 0.01s system 95% cpu 0.052 total\n\n$ time node -e '\u002FA(B|C+)+D\u002F.test(\"ACCCCCCCCCCCCCCCCCCCCCCCCCCCCX\")'\n1.79s user 0.02s system 99% cpu 1.812 total\n```\n\nThe entire process of testing it against a 30 characters long string takes around ~52ms. But when given an invalid string, it takes nearly two seconds to complete the test, over ten times as long as it took to test a valid string. The dramatic difference is due to the way regular expressions get evaluated.\n\nMost Regex engines will work very similarly (with minor differences). The engine will match the first possible way to accept the current character and proceed to the next one. If it then fails to match the next one, it will backtrack and see if there was another way to digest the previous character. If it goes too far down the rabbit hole only to find out the string doesn’t match in the end, and if many characters have multiple valid regex paths, the number of backtracking steps can become very large, resulting in what is known as _catastrophic backtracking_.\n\nLet's look at how our expression runs into this problem, using a shorter string: \"ACCCX\". While it seems fairly straightforward, there are still four different ways that the engine could match those three C's:\n1. CCC\n2. CC+C\n3. C+CC\n4. C+C+C.\n\nThe engine has to try each of those combinations to see if any of them potentially match against the expression. When you combine that with the other steps the engine must take, we can use [RegEx 101 debugger](https:\u002F\u002Fregex101.com\u002Fdebugger) to see the engine has to take a total of 38 steps before it can determine the string doesn't match.\n\nFrom there, the number of steps the engine must use to validate a string just continues to grow.\n\n| String | Number of C's | Number of steps |\n| -------|-------------:| -----:|\n| ACCCX | 3 | 38\n| ACCCCX | 4 | 71\n| ACCCCCX | 5 | 136\n| ACCCCCCCCCCCCCCX | 14 | 65,553\n\n\nBy the time the string includes 14 C's, the engine has to take over 65,000 steps just to see if the string is valid. These extreme situations can cause them to work very slowly (exponentially related to input size, as shown above), allowing an attacker to exploit this and can cause the service to excessively consume CPU, resulting in a Denial of Service.\n\n## Remediation\nUpgrade `lodash` to version 4.17.21 or higher.\n## References\n- [GitHub Commit](https:\u002F\u002Fgithub.com\u002Flodash\u002Flodash\u002Fcommit\u002Fc4847ebe7d14540bb28a8b932a9ce1b9ecbfee1a)\n- [GitHub Fix PR](https:\u002F\u002Fgithub.com\u002Flodash\u002Flodash\u002Fpull\u002F5065)\n",[120],{"min":14,"max":121},{"version":101,"inclusive":17},5.3,"2021-02-15T11:50:49Z",{"CVE":125,"CWE":127},[126],"CVE-2020-28500",[128],"CWE-400",{"Overview":130,"Details":131,"Remediation":113,"References":132},"\u003Cp>\u003Ca href=\"https:\u002F\u002Fwww.npmjs.com\u002Fpackage\u002Flodash\">lodash\u003C\u002Fa> is a modern JavaScript utility library delivering modularity, performance, &amp; extras.\u003C\u002Fp>\n\u003Cp>Affected versions of this package are vulnerable to Regular Expression Denial of Service (ReDoS) via the \u003Ccode>toNumber\u003C\u002Fcode>, \u003Ccode>trim\u003C\u002Fcode> and \u003Ccode>trimEnd\u003C\u002 >\n\u003Cp>Let&#39;s look at how our expression runs into this problem, using a shorter string: &quot;ACCCX&quot;. While it seems fairly straightforward, there are still four different ways that the engine could match those three C&#39;s:\u003C\u002Fp>\n\u003Col>\n\u003Cli>CCC\u003C\u002Fli>\n\u003Cli>CC+C\u003C\u002Fli>\n\u003Cli>C+CC\u003C\u002Fli>\n\u003Cli>C+C+C.\u003C\u002Fli>\n\u003C\u002Fol>\n\u003Cp>The engine has to try each of those combinations to see if any of them potentially match against the expression. When you combine that with the other steps the engine must take, we can use \u003Ca href=\"https:\u002F\u002Fregex101.com\u002Fdebugger\">RegEx 101 debugger\u003C\u002Fa> to see the engine has to take a total of 38 steps before it can determine the string doesn&#39;t match.\u003C\u002Fp>\n\u003Cp>From there, the number of steps the engine must use to validate a string just continues to grow.\u003C\u002Fp>\n\u003Ctable>\n\u003Cthead>\n\u003Ctr>\n\u003Cth>String\u003C\u002Fth>\n\u003Cth align=\"right\">Number of C&#39;s\u003C\u002Fth>\n\u003Cth align=\"right\">Number of steps\u003C\u002Fth>\n\u003C\u002Ftr>\n\u003C\u002Fthead>\n\u003Ctbody>\u003Ctr>\n\u003Ctd>ACCCX\u003C\u002Ftd>\n\u003Ctd align=\"right\">3\u003C\u002Ftd>\n\u003Ctd align=\"right\">38\u003C\u002Ftd>\n\u003C\u002Ftr>\n\u003Ctr>\n\u003Ctd>ACCCCX\u003C\u002Ftd>\n\u003Ctd align=\"right\">4\u003C\u002Ftd>\n\u003Ctd align=\"right\">71\u003C\u002Ftd>\n\u003C\u002Ftr>\n\u003Ctr>\n\u003Ctd>ACCCCCX\u003C\u002Ftd>\n\u003Ctd align=\"right\">5\u003C\u002Ftd>\n\u003Ctd align=\"right\">136\u003C\u002Ftd>\n\u003C\u002Ftr>\n\u003Ctr>\n\u003Ctd>ACCCCCCCCCCCCCCX\u003C\u002Ftd>\n\u003Ctd align=\"right\">14\u003C\u002Ftd>\n\u003Ctd align=\"right\">65,553\u003C\u002Ftd>\n\u003C\u002Ftr>\n\u003C\u002Ftbody>\u003C\u002Ftable>\n\u003Cp>By the time the string includes 14 C&#39;s, the engine has to take over 65,000 steps just to see if the string is valid. These extreme situations can cause them to work very slowly (exponentially related to input size, as shown above), allowing an attacker to exploit this and can cause the service to excessively consume CPU, resulting in a Denial of Service.\u003C\u002Fp>\n","\u003Cul>\n\u003Cli>\u003Ca href=\"https:\u002F\u002Fgithub.com\u002Flodash\u002Flodash\u002Fcommit\u002Fc4847ebe7d14540bb28a8b932a9ce1b9ecbfee1a\">GitHub Commit\u003C\u002Fa>\u003C\u002Fli>\n\u003Cli>\u003Ca href=\"https:\u002F\u002Fgithub.com\u002Flodash\u002Flodash\u002Fpull\u002F5065\">GitHub Fix PR\u003C\u002Fa>\u003C\u002Fli>\n\u003C\u002Ful>\n",{"id":134,"title":33,"description":135,"severity":11,"affectedVersions":136,"malicious":17,"cvssScore":139,"publicationTime":140,"identifiers":141,"vulnDescription":144},"SNYK-JS-LODASH-608086","## Overview\n[lodash](https:\u002F\u002Fwww.npmjs.com\u002Fpackage\u002Flodash) is a modern JavaScript utility library delivering modularity, performance, & extras.\n\nAffected versions of this package are vulnerable to Prototype Pollution via the `set` and `setwith` functions due to improper user input sanitization.\n## PoC\n```js\r\nlod = require('lodash')\r\nlod.set({}, \"__proto__[test2]\", \"456\")\r\nconsole.log(Object.prototype)\r\n```\n\n## Details\n\nPrototype Pollution is a vulnerability affecting JavaScript. Prototype Pollution refers to the ability to inject properties into existing JavaScript language construct prototypes, such as objects. JavaScript allows all Object attributes to be altered, including their magical attributes such as `__proto__`, `constructor` and `prototype`. An attacker manipulates these attributes to overwrite, or pollute, a JavaScript application object prototype of the base object by injecting other values.  Properties on the `Object.prototype` are then inherited by all the JavaScript objects through the prototype chain. When that happens, this leads to either denial of service by triggering JavaScript exceptions, or it tampers with the application source code to force the code path that the attacker injects, thereby leading to remote code execution.\n\nThere are two main ways in which the pollution of prototypes occurs:\n\n-   Unsafe `Object` recursive merge\n    \n-   Property definition by path\n    \n\n### Unsafe Object recursive merge\n\nThe logic of a vulnerable recursive merge function follows the following high-level model:\n```\nmerge (target, source)\n\n  foreach property of source\n\n    if property exists and is an object on both the target and the source\n\n      merge(target[property], source[property])\n\n    else\n\n      target[property] = source[property]\n```\n\u003Cbr>  \n\nWhen the source object contains a property named `__proto__` defined with `Object.defineProperty()` , the condition that checks if the property exists and is an object on both the target and the source passes and the merge recurses with the target, being the prototype of `Object` and the source of `Object` as defined by the attacker. Properties are then copied on the `Object` prototype.\n\nClone operations are a special sub-class of unsafe recursive merges, which occur when a recursive merge is conducted on an empty object: `merge({},source)`.\n\n`lodash` and `Hoek` are examples of libraries susceptible to recursive merge attacks.\n\n### Property definition by path\n\nThere are a few JavaScript libraries that use an API to define property values on an object based on a given path. The function that is generally affected contains this signature: `theFunction(object, path, value)`\n\nIf the attacker can control the value of “path”, they can set this value to `__proto__.myValue`. `myValue` is then assigned to the prototype of the class of the object.\n\n## Types of attacks\n\nThere are a few methods by which Prototype Pollution can be manipulated:\n\n| Type |Origin  |Short description |\n|--|--|--|\n| **Denial of service (DoS)**|Client  |This is the most likely attack. \u003Cbr>DoS occurs when `Object` holds generic functions that are implicitly called for various operations (for example, `toString` and `valueOf`). \u003Cbr> The attacker pollutes `Object.prototype.someattr` and alters its state to an unexpected value such as `Int` or `Object`. In this case, the code fails and is likely to cause a denial of service.  \u003Cbr>**For example:** if an attacker pollutes `Object.prototype.toString` by defining it as an integer, if the codebase at any point was reliant on `someobject.toString()` it would fail. |\n |**Remote Code Execution**|Client|Remote code execution is generally only possible in cases where the codebase evaluates a specific attribute of an object, and then executes that evaluation.\u003Cbr>**For example:** `eval(someobject.someattr)`. In this case, if the attacker pollutes `Object.prototype.someattr` they are likely to be able to leverage this in order to execute code.|\n|**Property Injection**|Client|The attacker pollutes properties that the codebase relies on for their informative value, including security properties such as cookies or tokens.\u003Cbr>  **For example:** if a codebase checks privileges for `someuser.isAdmin`, then when the attacker pollutes `Object.prototype.isAdmin` and sets it to equal `true`, they can then achieve admin privileges.|\n\n## Affected environments\n\nThe following environments are susceptible to a Prototype Pollution attack:\n\n-   Application server\n    \n-   Web server\n\n-   Web browser\n    \n\n## How to prevent\n\n1.  Freeze the prototype— use `Object.freeze (Object.prototype)`.\n    \n2.  Require schema validation of JSON input.\n    \n3.  Avoid using unsafe recursive merge functions.\n    \n4.  Consider using objects without prototypes (for example, `Object.create(null)`), breaking the prototype chain and preventing pollution.\n    \n5.  As a best practice use `Map` instead of `Object`.\n\n### For more information on this vulnerability type:\n\n[Arteau, Olivier. “JavaScript prototype pollution attack in NodeJS application.” GitHub, 26 May 2018](https:\u002F\u002Fgithub.com\u002FHoLyVieR\u002Fprototype-pollution-nsec18\u002Fblob\u002Fmaster\u002Fpaper\u002FJavaScript_prototype_pollution_attack_in_NodeJS.pdf)\n\n## Remediation\nUpgrade `lodash` to version 4.17.17 or higher.\n## References\n- [HackerOne Report](https:\u002F\u002Fhackerone.com\u002Freports\u002F864701)\n",[137],{"min":14,"max":138},{"version":83,"inclusive":17},7.3,"2020-08-21T12:53:03Z",{"CVE":142,"CWE":143},[],[48],{"Overview":145,"PoC":146,"Details":53,"Types of attacks":54,"Affected environments":55,"How to prevent":56,"Remediation":92,"References":147},"\u003Cp>\u003Ca href=\"https:\u002F\u002Fwww.npmjs.com\u002Fpackage\u002Flodash\">lodash\u003C\u002Fa> is a modern JavaScript utility library delivering modularity, performance, &amp; extras.\u003C\u002Fp>\n\u003Cp>Affected versions of this package are vulnerable to Prototype Pollution via the \u003Ccode>set\u003C\u002Fcode> and \u003Ccode>setwith\u003C\u002Fcode> functions due to improper user input sanitization.\u003C\u002Fp>\n","\u003Cpre>\u003Ccode class=\"language-js\">lod = require(&#39;lodash&#39;)\nlod.set({}, &quot;__proto__[test2]&quot;, &quot;456&quot;)\nconsole.log(Object.prototype)\n\u003C\u002Fcode>\u003C\u002Fpre>\n","\u003Cul>\n\u003Cli>\u003Ca href=\"https:\u002F\u002Fhackerone.com\u002Freports\u002F864701\">HackerOne Report\u003C\u002Fa>\u003C\u002Fli>\n\u003C\u002Ful>\n",{"id":149,"title":33,"description":150,"severity":11,"affectedVersions":151,"malicious":17,"cvssScore":157,"publicationTime":158,"identifiers":159,"vulnDescription":167},"SNYK-JS-LODASH-567746","## Overview\n[lodash](https:\u002F\u002Fwww.npmjs.com\u002Fpackage\u002Flodash) is a modern JavaScript utility library delivering modularity, performance, & extras.\n\nAffected versions of this package are vulnerable to Prototype Pollution. The function `zipObjectDeep` can be tricked into adding or modifying properties of the Object prototype. These properties will be present on all objects.\n## PoC\n```js\r\nconst _ = require('lodash');\r\n\r\n
