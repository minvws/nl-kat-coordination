s conducted on an empty object: `merge({},source)`.\n\n`lodash` and `Hoek` are examples of libraries susceptible to recursive merge attacks.\n\n### Property definition by path\n\nThere are a few JavaScript libraries that use an API to define property values on an object based on a given path. The function that is generally affected contains this signature: `theFunction(object, path, value)`\n\nIf the attacker can control the value of “path”, they can set this value to `__proto__.myValue`. `myValue` is then assigned to the prototype of the class of the object.\n\n## Types of attacks\n\nThere are a few methods by which Prototype Pollution can be manipulated:\n\n| Type |Origin  |Short description |\n|--|--|--|\n| **Denial of service (DoS)**|Client  |This is the most likely attack. \u003Cbr>DoS occurs when `Object` holds generic functions that are implicitly called for various operations (for example, `toString` and `valueOf`). \u003Cbr> The attacker pollutes `Object.prototype.someattr` and alters its state to an unexpected value such as `Int` or `Object`. In this case, the code fails and is likely to cause a denial of service.  \u003Cbr>**For example:** if an attacker pollutes `Object.prototype.toString` by defining it as an integer, if the codebase at any point was reliant on `someobject.toString()` it would fail. |\n |**Remote Code Execution**|Client|Remote code execution is generally only possible in cases where the codebase evaluates a specific attribute of an object, and then executes that evaluation.\u003Cbr>**For example:** `eval(someobject.someattr)`. In this case, if the attacker pollutes `Object.prototype.someattr` they are likely to be able to leverage this in order to execute code.|\n|**Property Injection**|Client|The attacker pollutes properties that the codebase relies on for their informative value, including security properties such as cookies or tokens.\u003Cbr>  **For example:** if a codebase checks privileges for `someuser.isAdmin`, then when the attacker pollutes `Object.prototype.isAdmin` and sets it to equal `true`, they can then achieve admin privileges.|\n\n## Affected environments\n\nThe following environments are susceptible to a Prototype Pollution attack:\n\n-   Application server\n    \n-   Web server\n\n-   Web browser\n    \n\n## How to prevent\n\n1.  Freeze the prototype— use `Object.freeze (Object.prototype)`.\n    \n2.  Require schema validation of JSON input.\n    \n3.  Avoid using unsafe recursive merge functions.\n    \n4.  Consider using objects without prototypes (for example, `Object.create(null)`), breaking the prototype chain and preventing pollution.\n    \n5.  As a best practice use `Map` instead of `Object`.\n\n### For more information on this vulnerability type:\n\n[Arteau, Olivier. “JavaScript prototype pollution attack in NodeJS application.” GitHub, 26 May 2018](https:\u002F\u002Fgithub.com\u002FHoLyVieR\u002Fprototype-pollution-nsec18\u002Fblob\u002Fmaster\u002Fpaper\u002FJavaScript_prototype_pollution_attack_in_NodeJS.pdf)\n\n## Remediation\nUpgrade `lodash` to version 4.17.20 or higher.\n## References\n- [GitHub Commit](https:\u002F\u002Fgithub.com\u002Flodash\u002Flodash\u002Fcommit\u002Fc84fe82760fb2d3e03a63379b297a1cc1a2fce12)\n- [GitHub PR](https:\u002F\u002Fgithub.com\u002Flodash\u002Flodash\u002Fpull\u002F4759)\n",[152],{"min":153,"max":155},{"version":154,"inclusive":40},"4.1.0",{"version":156,"inclusive":17},"4.17.20",8.2,"2020-04-28T14:59:14Z",{"CVE":160,"CWE":162,"NSP":163,"GHSA":165},[161],"CVE-2020-8203",[48],[164],"1523",[166],"GHSA-p6mc-m468-83gw",{"Overview":168,"PoC":169,"Details":53,"Types of attacks":54,"Affected environments":55,"How to prevent":56,"Remediation":170,"References":171},"\u003Cp>\u003Ca href=\"https:\u002F\u002Fwww.npmjs.com\u002Fpackage\u002Flodash\">lodash\u003C\u002Fa> is a modern JavaScript utility library delivering modularity, performance, &amp; extras.\u003C\u002Fp>\n\u003Cp>Affected versions of this package are vulnerable to Prototype Pollution. The function \u003Ccode>zipObjectDeep\u003C\u002Fcode> can be tricked into adding or modifying properties of the Object prototype. These properties will be present on all objects.\u003C\u002Fp>\n","\u003Cpre>\u003Ccode class=\"language-js\">const _ = require(&#39;lodash&#39;);\n\n_.zipObjectDeep([&#39;__proto__.z&#39;],[123]);\n\nconsole.log(z); \u002F\u002F 123\n\u003C\u002Fcode>\u003C\u002Fpre>\n","\u003Cp>Upgrade \u003Ccode>lodash\u003C\u002Fcode> to version 4.17.20 or higher.\u003C\u002Fp>\n","\u003Cul>\n\u003Cli>\u003Ca href=\"https:\u002F\u002Fgithub.com\u002Flodash\u002Flodash\u002Fcommit\u002Fc84fe82760fb2d3e03a63379b297a1cc1a2fce12\">GitHub Commit\u003C\u002Fa>\u003C\u002Fli>\n\u003Cli>\u003Ca href=\"https:\u002F\u002Fgithub.com\u002Flodash\u002Flodash\u002Fpull\u002F4759\">GitHub PR\u003C\u002Fa>\u003C\u002Fli>\n\u003C\u002Ful>\n",{"id":173,"title":33,"description":174,"severity":11,"affectedVersions":175,"malicious":17,"cvssScore":139,"publicationTime":179,"identifiers":180,"vulnDescription":188},"SNYK-JS-LODASH-450202","## Overview\n[lodash](https:\u002F\u002Fwww.npmjs.com\u002Fpackage\u002Flodash) is a modern JavaScript utility library delivering modularity, performance, & extras.\n\nAffected versions of this package are vulnerable to Prototype Pollution. The function `defaultsDeep` could be tricked into adding or modifying properties of `Object.prototype` using a `constructor` payload.\r\n\r\n## PoC by Snyk\r\n```\r\nconst mergeFn = require('lodash').defaultsDeep;\r\nconst payload = '{\"constructor\": {\"prototype\": {\"a0\": true}}}'\r\n\r\nfunction check() {\r\n    mergeFn({}, JSON.parse(payload));\r\n    if (({})[`a0`] === true) {\r\n        console.log(`Vulnerable to Prototype Pollution via ${payload}`);\r\n    }\r\n  }\r\n\r\ncheck();\r\n```\r\n\r\nFor more information, check out our [blog post](https:\u002F\u002Fsnyk.io\u002Fblog\u002Fsnyk-research-team-discovers-severe-prototype-pollution-security-vulnerabilities-affecting-all-versions-of-lodash\u002F)\n\n## Details\n\nPrototype Pollution is a vulnerability affecting JavaScript. Prototype Pollution refers to the ability to inject properties into existing JavaScript language construct prototypes, such as objects. JavaScript allows all Object attributes to be altered, including their magical attributes such as `__proto__`, `constructor` and `prototype`. An attacker manipulates these attributes to overwrite, or pollute, a JavaScript application object prototype of the base object by injecting other values.  Properties on the `Object.prototype` are then inherited by all the JavaScript objects through the prototype chain. When that happens, this leads to either denial of service by triggering JavaScript exceptions, or it tampers with the application source code to force the code path that the attacker injects, thereby leading to remote code execution.\n\nThere are two main ways in which the pollution of prototypes occurs:\n\n-   Unsafe `Object` recursive merge\n    \n-   Property definition by path\n    \n\n### Unsafe Object recursive merge\n\nThe logic of a vulnerable recursive merge function follows the following high-level model:\n```\nmerge (target, source)\n\n  foreach property of source\n\n    if property exists and is an object on both the target and the source\n\n      merge(target[property], source[property])\n\n    else\n\n      target[property] = source[property]\n```\n\u003Cbr>  \n\nWhen the source object contains a property named `__proto__` defined with `Object.defineProperty()` , the condition that checks if the property exists and is an object on both the target and the source passes and the merge recurses with the target, being the prototype of `Object` and the source of `Object` as defined by the attacker. Properties are then copied on the `Object` prototype.\n\nClone operations are a special sub-class of unsafe recursive merges, which occur when a recursive merge is conducted on an empty object: `merge({},source)`.\n\n`lodash` and `Hoek` are examples of libraries susceptible to recursive merge attacks.\n\n### Property definition by path\n\nThere are a few JavaScript libraries that use an API to define property values on an object based on a given path. The function that is generally affected contains this signature: `theFunction(object, path, value)`\n\nIf the attacker can control the value of “path”, they can set this value to `__proto__.myValue`. `myValue` is then assigned to the prototype of the class of the object.\n\n## Types of attacks\n\nThere are a few methods by which Prototype Pollution can be manipulated:\n\n| Type |Origin  |Short description |\n|--|--|--|\n| **Denial of service (DoS)**|Client  |This is the most likely attack. \u003Cbr>DoS occurs when `Object` holds generic functions that are implicitly called for various operations (for example, `toString` and `valueOf`). \u003Cbr> The attacker pollutes `Object.prototype.someattr` and alters its state to an unexpected value such as `Int` or `Object`. In this case, the code fails and is likely to cause a denial of service.  \u003Cbr>**For example:** if an attacker pollutes `Object.prototype.toString` by defining it as an integer, if the codebase at any point was reliant on `someobject.toString()` it would fail. |\n |**Remote Code Execution**|Client|Remote code execution is generally only possible in cases where the codebase evaluates a specific attribute of an object, and then executes that evaluation.\u003Cbr>**For example:** `eval(someobject.someattr)`. In this case, if the attacker pollutes `Object.prototype.someattr` they are likely to be able to leverage this in order to execute code.|\n|**Property Injection**|Client|The attacker pollutes properties that the codebase relies on for their informative value, including security properties such as cookies or tokens.\u003Cbr>  **For example:** if a codebase checks privileges for `someuser.isAdmin`, then when the attacker pollutes `Object.prototype.isAdmin` and sets it to equal `true`, they can then achieve admin privileges.|\n\n## Affected environments\n\nThe following environments are susceptible to a Prototype Pollution attack:\n\n-   Application server\n    \n-   Web server\n\n-   Web browser\n    \n\n## How to prevent\n\n1.  Freeze the prototype— use `Object.freeze (Object.prototype)`.\n    \n2.  Require schema validation of JSON input.\n    \n3.  Avoid using unsafe recursive merge functions.\n    \n4.  Consider using objects without prototypes (for example, `Object.create(null)`), breaking the prototype chain and preventing pollution.\n    \n5.  As a best practice use `Map` instead of `Object`.\n\n### For more information on this vulnerability type:\n\n[Arteau, Olivier. “JavaScript prototype pollution attack in NodeJS application.” GitHub, 26 May 2018](https:\u002F\u002Fgithub.com\u002FHoLyVieR\u002Fprototype-pollution-nsec18\u002Fblob\u002Fmaster\u002Fpaper\u002FJavaScript_prototype_pollution_attack_in_NodeJS.pdf)\n\n## Remediation\nUpgrade `lodash` to version 4.17.12 or higher.\n## References\n- [GitHub Issue](https:\u002F\u002Fgithub.com\u002Flodash\u002Flodash\u002Fissues\u002F4348)\n- [GitHub PR](https:\u002F\u002Fgithub.com\u002Flodash\u002Flodash\u002Fpull\u002F4336)\n- [GitHub PR](https:\u002F\u002Fgithub.com\u002Flodash\u002Flodash\u002Fpull\u002F4355)\n- [GitHub PR](https:\u002F\u002Fgithub.com\u002Fsailshq\u002Flodash\u002Fpull\u002F1)\n- [Node Security Advisory](https:\u002F\u002Fwww.npmjs.com\u002Fadvisories\u002F1065)\n- [Snyk Blog](https:\u002F\u002Fsnyk.io\u002Fblog\u002Fsnyk-research-team-discovers-severe-prototype-pollution-security-vulnerabilities-affecting-all-versions-of-lodash\u002F)\n",[176],{"min":14,"max":177},{"version":178,"inclusive":17},"4.17.12","2019-07-02T11:45:01Z",{"CVE":181,"CWE":183,"NSP":184,"GHSA":186},[182],"CVE-2019-10744",[48],[185],"1065",[187],"GHSA-jf85-cpcp-j695",{"Overview":189,"PoC by Snyk":190,"Details":53,"Types of attacks":54,"Affected environments":55,"How to prevent":56,"Remediation":191,"References":192},"\u003Cp>\u003Ca href=\"https:\u002F\u002Fwww.npmjs.com\u002Fpackage\u002Flodash\">lodash\u003C\u002Fa> is a modern JavaScript utility library delivering modularity, performance, &amp; extras.\u003C\u002Fp>\n\u003Cp>Affected versions of this package are vulnerable to Prototype Pollution. The function \u003Ccode>defaultsDeep\u003C\u002Fcode> could be tricked into adding or modifying properties of \u003Ccode>Object.prototype\u003C\u002Fcode> using a \u003Ccode>constructor\u003C\u002Fcode> payload.\u003C\u002Fp>\n","\u003Cpre>\u003Ccode>const mergeFn = require(&#39;lodash&#39;).defaultsDeep;\nconst payload = &#39;{&quot;constructor&quot;: {&quot;prototype&quot;: {&quot;a0&quot;: true}}}&#39;\n\nfunction check() {\n    mergeFn({}, JSON.parse(payload));\n    if (({})[`a0`] === true) {\n        console.log(`Vulnerable to Prototype Pollution via ${payload}`);\n    }\n  }\n\ncheck();\n\u003C\u002Fcode>\u003C\u002Fpre>\n\u003Cp>For more information, check out our \u003Ca href=\"https:\u002F\u002Fsnyk.io\u002Fblog\u002Fsnyk-research-team-discovers-severe-prototype-pollution-security-vulnerabilities-affecting-all-versions-of-lodash\u002F\">blog post\u003C\u002Fa>\u003C\u002Fp>\n","\u003Cp>Upgrade \u003Ccode>lodash\u003C\u002Fcode> to version 4.17.12 or higher.\u003C\u002Fp>\n","\u003Cul>\n\u003Cli>\u003Ca href=\"https:\u002F\u002Fgithub.com\u002Flodash\u002Flodash\u002Fissues\u002F4348\">GitHub Issue\u003C\u002Fa>\u003C\u002Fli>\n\u003Cli>\u003Ca href=\"https:\u002F\u002Fgithub.com\u002Flodash\u002Flodash\u002Fpull\u002F4336\">GitHub PR\u003C\u002Fa>\u003C\u002Fli>\n\u003Cli>\u003Ca href=\"https:\u002F\u002Fgithub.com\u002Flodash\u002Flodash\u002Fpull\u002F4355\">GitHub PR\u003C\u002Fa>\u003C\u002Fli>\n\u003Cli>\u003Ca href=\"https:\u002F\u002Fgithub.com\u002Fsailshq\u002Flodash\u002Fpull\u002F1\">GitHub PR\u003C\u002Fa>\u003C\u002Fli>\n\u003Cli>\u003Ca href=\"https:\u002F\u002Fwww.npmjs.com\u002Fadvisories\u002F1065\">Node Security Advisory\u003C\u002Fa>\u003C\u002Fli>\n\u003Cli>\u003Ca href=\"https:\u002F\u002Fsnyk.io\u002Fblog\u002Fsnyk-research-team-discovers-severe-prototype-pollution-security-vulnerabilities-affecting-all-versions-of-lodash\u002F\">Snyk Blog\u003C\u002Fa>\u003C\u002Fli>\n\u003C\u002Ful>\n",{"id":194,"title":117,"description":195,"severity":35,"affectedVersions":196,"malicious":17,"cvssScore":200,"publicationTime":201,"identifiers":202,"vulnDescription":207},"SNYK-JS-LODASH-73639","## Overview\n[lodash](https:\u002F\u002Fwww.npmjs.com\u002Fpackage\u002Flodash) is a modern JavaScript utility library delivering modularity, performance, & extras.\n\nAffected versions of this package are vulnerable to Regular Expression Denial of Service (ReDoS). It parses dates using regex strings, which may cause a slowdown of 2 seconds per 50k characters.\n\n## Details\n\nDenial of Service (DoS) describes a family of attacks, all aimed at making a system inaccessible to its original and legitimate users. There are many types of DoS attacks, ranging from trying to clog the network pipes to the system by generating a large volume of traffic from many machines (a Distributed Denial of Service - DDoS - attack) to sending crafted requests that cause a system to crash or take a disproportional amount of time to process.\n\nThe Regular expression Denial of Service (ReDoS) is a type of Denial of Service attack. Regular expressions are incredibly powerful, but they aren't very intuitive and can ultimately end up making it easy for attackers to take your site down.\n\nLet’s take the following regular expression as an example:\n```js\nregex = \u002FA(B|C+)+D\u002F\n```\n\nThis regular expression accomplishes the following:\n- `A` The string must start with the letter 'A'\n- `(B|C+)+` The string must then follow the letter A with either the letter 'B' or some number of occurrences of the letter 'C' (the `+` matches one or more times). The `+` at the end of this section states that we can look for one or more matches of this section.\n- `D` Finally, we ensure this section of the string ends with a 'D'\n\nThe expression would match inputs such as `ABBD`, `ABCCCCD`, `ABCBCCCD` and `ACCCCCD`\n\nIt most cases, it doesn't take very long for a regex engine to find a match:\n\n```bash\n$ time node -e '\u002FA(B|C+)+D\u002F.test(\"ACCCCCCCCCCCCCCCCCCCCCCCCCCCCD\")'\n0.04s user 0.01s system 95% cpu 0.052 total\n\n$ time node -e '\u002FA(B|C+)+D\u002F.test(\"ACCCCCCCCCCCCCCCCCCCCCCCCCCCCX\")'\n1.79s user 0.02s system 99% cpu 1.812 total\n```\n\nThe entire process of testing it against a 30 characters long string takes around ~52ms. But when given an invalid string, it takes nearly two seconds to complete the test, over ten times as long as it took to test a valid string. The dramatic difference is due to the way regular expressions get evaluated.\n\nMost Regex engines will work very similarly (with minor differences). The engine will match the first possible way to accept the current character and proceed to the next one. If it then fails to match the next one, it will backtrack and see if there was another way to digest the previous character. If it goes too far down the rabbit hole only to find out the string doesn’t match in the end, and if many characters have multiple valid regex paths, the number of backtracking steps can become very large, resulting in what is known as _catastrophic backtracking_.\n\nLet's look at how our expression runs into this problem, using a shorter string: \"ACCCX\". While it seems fairly straightforward, there are still four different ways that the engine could match those three C's:\n1. CCC\n2. CC+C\n3. C+CC\n4. C+C+C.\n\nThe engine has to try each of those combinations to see if any of them potentially match against the expression. When you combine that with the other steps the engine must take, we can use [RegEx 101 debugger](https:\u002F\u002Fregex101.com\u002Fdebugger) to see the engine has to take a total of 38 steps before it can determine the string doesn't match.\n\nFrom there, the number of steps the engine must use to validate a string just continues to grow.\n\n| String | Number of C's | Number of steps |\n| -------|-------------:| -----:|\n| ACCCX | 3 | 38\n| ACCCCX | 4 | 71\n| ACCCCCX | 5 | 136\n| ACCCCCCCCCCCCCCX | 14 | 65,553\n\n\nBy the time the string includes 14 C's, the engine has to take over 65,000 steps just to see if the string is valid. These extreme situations can cause them to work very slowly (exponentially related to input size, as shown above), allowing an attacker to exploit this and can cause the service to excessively consume CPU, resulting in a Denial of Service.\n\n## Remediation\nUpgrade `lodash` to version 4.17.11 or higher.\n## References\n- [GitHub Commit](https:\u002F\u002Fgithub.com\u002Flodash\u002Flodash\u002Fcommit\u002F5c08f18d365b64063bfbfa686cbb97cdd6267347)\n- [GitHub PR](https:\u002F\u002Fgithub.com\u002Flodash\u002Flodash\u002Fpull\u002F4450)\n- [POC: GitHub Issue](https:\u002F\u002Fgithub.com\u002Flodash\u002Flodash\u002Fissues\u002F3359)\n",[197],{"min":14,"max":198},{"version":199,"inclusive":17},"4.17.11",4.4,"2019-04-05T09:14:22Z",{"CVE":203,"CWE":205},[204],"CVE-2019-1010266",[206],"CWE-185",{"Overview":208,"Details":131,"Remediation":209,"References":210},"\u003Cp>\u003Ca href=\"https:\u002F\u002Fwww.npmjs.com\u002Fpackage\u002Flodash\">lodash\u003C\u002Fa> is a modern JavaScript utility library delivering modularity, performance, &amp; extras.\u003C\u002Fp>\n\u003Cp>Affected versions of this package are vulnerable to Regular Expression Denial of Service (ReDoS). It parses dates using regex strings, which may cause a slowdown of 2 seconds per 50k characters.\u003C\u002Fp>\n","\u003Cp>Upgrade \u003Ccode>lodash\u003C\u002Fcode> to version 4.17.11 or higher.\u003C\u002Fp>\n","\u003Cul>\n\u003Cli>\u003Ca href=\"https:\u002F\u002Fgithub.com\u002Flodash\u002Flodash\u002Fcommit\u002F5c08f18d365b64063bfbfa686cbb97cdd6267347\">GitHub Commit\u003C\u002Fa>\u003C\u002Fli>\n\u003Cli>\u003Ca href=\"https:\u002F\u002Fgithub.com\u002Flodash\u002Flodash\u002Fpull\u002F4450\">GitHub PR\u003C\u002Fa>\u003C\u002Fli>\n\u003Cli>\u003Ca href=\"https:\u002F\u002Fgithub.com\u002Flodash\u002Flodash\u002Fissues\u002F3359\">POC: GitHub Issue\u003C\u002Fa>\u003C\u002Fli>\n\u003C\u002Ful>\n",{"id":212,"title":33,"description":213,"severity":11,"affectedVersions":214,"malicious":17,"cvssScore":139,"publicationTime":217,"identifiers":218,"vulnDescription":229},"SNYK-JS-LODASH-73638","## Overview\n[lodash](https:\u002F\u002Fwww.npmjs.com\u002Fpackage\u002Flodash) is a modern JavaScript utility library delivering modularity, performance, & extras.\n\nAffected versions of this package are vulnerable to Prototype Pollution. The functions `merge`, `mergeWith`, and `defaultsDeep` could be tricked into adding or modifying properties of `Object.prototype`. This is due to an incomplete fix to `CVE-2018-3721`.\n\n## Details\n\nPrototype Pollution is a vulnerability affecting JavaScript. Prototype Pollution refers to the ability to inject properties into existing JavaScript language construct prototypes, such as objects. JavaScript allows all Object attributes to be altered, including their magical attributes such as `__proto__`, `constructor` and `prototype`. An attacker manipulates these attributes to overwrite, or pollute, a JavaScript application object prototype of the base object by injecting other values.  Properties on the `Object.prototype` are then inherited by all the JavaScript objects through the prototype chain. When that happens, this leads to either denial of service by triggering JavaScript exceptions, or it tampers with the application source code to force the code path that the attacker injects, thereby leading to remote code execution.\n\nThere are two main ways in which the pollution of prototypes occurs:\n\n-   Unsafe `Object` recursive merge\n    \n-   Property definition by path\n    \n\n### Unsafe Object recursive merge\n\nThe logic of a vulnerable recursive merge function follows the following high-level model:\n```\nmerge (target, source)\n\n  foreach property of source\n\n    if property exists and is an object on both the target and the source\n\n      merge(target[property], source[property])\n\n    else\n\n      target[property] = source[property]\n```\n\u003Cbr>  \n\nWhen the source object contains a property named `__proto__` defined with `Object.defineProperty()` , the condition that checks if the property exists and is an object on both the target and the source passes and the merge recurses with the target, being the prototype of `Object` and the source of `Object` as defined by the attacker. Properties are then copied on the `Object` prototype.\n\nClone operations are a special sub-class of unsafe recursive merges, which occur when a recursive merge is conducted on an empty object: `merge({},source)`.\n\n`lodash` and `Hoek` are examples of libraries susceptible to recursive merge attacks.\n\n### Property definition by path\n\nThere are a few JavaScript libraries that use an API to define property values on an object based on a given path. The function that is generally affected contains this signature: `theFunction(object, path, value)`\n\nIf the attacker can control the value of “path”, they can set this value to `__proto__.myValue`. `myValue` is then assigned to the prototype of the class of the object.\n\n## Types of attacks\n\nThere are a few methods by which Prototype Pollution can be manipulated:\n\n| Type |Origin  |Short description |\n|--|--|--|\n| **Denial of service (DoS)**|Client  |This is the most likely attack. \u003Cbr>DoS occurs when `Object` holds generic functions that are implicitly called for various operations (for example, `toString` and `valueOf`). \u003Cbr> The attacker pollutes `Object.prototype.someattr` and alters its state to an unexpected value such as `Int` or `Object`. In this case, the code fails and is likely to cause a denial of service.  \u003Cbr>**For example:** if an attacker pollutes `Object.prototype.toString` by defining it as an integer, if the codebase at any point was reliant on `someobject.toString()` it would fail. |\n |**Remote Code Execution**|Client|Remote code execution is generally only possible in cases where the codebase evaluates a specific attribute of an object, and then executes that evaluation.\u003Cbr>**For example:** `eval(someobject.someattr)`. In this case, if the attacker pollutes `Object.prototype.someattr` they are likely to be able to leverage this in order to execute code.|\n|**Property Injection**|Client|The attacker pollutes properties that the codebase relies on for their informative value, including security properties such as cookies or tokens.\u003Cbr>  **For example:** if a codebase checks privileges for `someuser.isAdmin`, then when the attacker pollutes `Object.prototype.isAdmin` and sets it to equal `true`, they can then achieve admin privileges.|\n\n## Affected environments\n\nThe following environments are susceptible to a Prototype Pollution attack:\n\n-   Application server\n    \n-   Web server\n\n-   Web browser\n    \n\n## How to prevent\n\n1.  Freeze the prototype— use `Object.freeze (Object.prototype)`.\n    \n2.  Require schema validation of JSON input.\n    \n3.  Avoid using unsafe recursive merge functions.\n    \n4.  Consider using objects without prototypes (for example, `Object.create(null)`), breaking the prototype chain and preventing pollution.\n    \n5.  As a best practice use `Map` instead of `Object`.\n\n### For more information on this vulnerability type:\n\n[Arteau, Olivier. “JavaScript prototype pollution attack in NodeJS application.” GitHub, 26 May 2018](https:\u002F\u002Fgithub.com\u002FHoLyVieR\u002Fprototype-pollution-nsec18\u002Fblob\u002Fmaster\u002Fpaper\u002FJavaScript_prototype_pollution_attack_in_NodeJS.pdf)\n\n## Remediation\nUpgrade `lodash` to version 4.17.11 or higher.\n## References\n- [GitHub Commit](https:\u002F\u002Fgithub.com\u002Flodash\u002Flodash\u002Fcommit\u002F90e6199a161b6445b01454517b40ef65ebecd2ad)\n- [GitHub PR](https:\u002F\u002Fgithub.com\u002Flodash\u002Flodash\u002Fpull\u002F4337)\n- [NPM Security Advisory](https:\u002F\u002Fwww.npmjs.com\u002Fadvisories\u002F1066)\n- [NPM Security Advisory](https:\u002F\u002Fwww.npmjs.com\u002Fadvisories\u002F1068)\n- [NPM Security Advisory](https:\u002F\u002Fwww.npmjs.com\u002Fadvisories\u002F1071)\n- [NPM Security Advisory](https:\u002F\u002Fwww.npmjs.com\u002Fadvisories\u002F782)\n- [POC: HackerOne Report](https:\u002F\u002Fhackerone.com\u002Freports\u002F380873)\n",[215],{"min":14,"max":216},{"version":199,"inclusive":17},"2019-02-01T18:21:00Z",{"CVE":219,"CWE":221,"NSP":222,"GHSA":227},[220],"CVE-2018-16487",[48],[223,224,225,226],"1066","1068","1071","782",[228],"GHSA-4xc9-xhrj-v574",{"Overview":230,"Details":53,"Types of attacks":54,"Affected environments":55,"How to prevent":56,"Remediation":209,"References":231},"\u003Cp>\u003Ca href=\"https:\u002F\u002Fwww.npmjs.com\u002Fpackage\u002Flodash\">lodash\u003C\u002Fa> is a modern JavaScript utility library delivering modularity, performance, &amp; extras.\u003C\u002Fp>\n\u003Cp>Affected versions of this package are vulnerable to Prototype Pollution. The functions \u003Ccode>merge\u003C\u002Fcode>, \u003Ccode>mergeWith\u003C\u002Fcode>, and \u003Ccode>defaultsDeep\u003C\u002Fcode> could be tricked into adding or modifying properties of \u003Ccode>Object.prototype\u003C\u002Fcode>. This is due to an incomplete fix to \u003Ccode>CVE-2018-3721\u003C\u002Fcode>.\u003C\u002Fp>\n","\u003Cul>\n\u003Cli>\u003Ca href=\"https:\u002F\u002Fgithub.com\u002Flodash\u002Flodash\u002Fcommit\u002F90e6199a161b6445b01454517b40ef65ebecd2ad\">GitHub Commit\u003C\u002Fa>\u003C\u002Fli>\n\u003Cli>\u003Ca href=\"https:\u002F\u002Fgithub.com\u002Flodash\u002Flodash\u002Fpull\u002F4337\">GitHub PR\u003C\u002Fa>\u003C\u002Fli>\n\u003Cli>\u003Ca href=\"https:\u002F\u002Fwww.npmjs.com\u002Fadvisories\u002F1066\">NPM Security Advisory\u003C\u002Fa>\u003C\u002Fli>\n\u003Cli>\u003Ca href=\"https:\u002F\u002Fwww.npmjs.com\u002Fadvisories\u002F1068\">NPM Security Advisory\u003C\u002Fa>\u003C\u002Fli>\n\u003Cli>\u003Ca href=\"https:\u002F\u002Fwww.npmjs.com\u002Fadvisories\u002F1071\">NPM Security Advisory\u003C\u002Fa>\u003C\u002Fli>\n\u003Cli>\u003Ca href=\"https:\u002F\u002Fwww.npmjs.com\u002Fadvisories\u002F782\">NPM Security Advisory\u003C\u002Fa>\u003C\u002Fli>\n\u003Cli>\u003Ca href=\"https:\u002F\u002Fhackerone.com\u002Freports\u002F380873\">POC: HackerOne Report\u003C\u002Fa>\u003C\u002Fli>\n\u003C\u002Ful>\n",{"id":233,"title":33,"description":234,"severity":35,"affectedVersions":235,"malicious":17,"cvssScore":239,"publicationTime":240,"identifiers":241,"vulnDescription":257},"npm:lodash:20180130","## Overview\n[lodash](https:\u002F\u002Fwww.npmjs.com\u002Fpackage\u002Flodash) is a modern JavaScript utility library delivering modularity, performance, & extras.\n\nAffected versions of this package are vulnerable to Prototype Pollution. The utilities function allow modification of the `Object` prototype. If an attacker can control part of the structure passed to this function, they could add or modify an existing property.  \r\n\r\n## PoC by Olivier Arteau (HoLyVieR)\r\n```js\r\nvar _= require('lodash');\r\nvar malicious_payload = '{\"__proto__\":{\"oops\":\"It works !\"}}';\r\n\r\nvar a = {};\r\nconsole.log(\"Before : \" + a.oops);\r\n_.merge({}, JSON.parse(malicious_payload));\r\nconsole.log(\"After : \" + a.oops);\r\n```\n\n## Details\n\nPrototype Pollution is a vulnerability affecting JavaScript. Prototype Pollution refers to the ability to inject properties into existing JavaScript language construct prototypes, such as objects. JavaScript allows all Object attributes to be altered, including their magical attributes such as `__proto__`, `constructor` and `prototype`. An attacker manipulates these attributes to overwrite, or pollute, a JavaScript application object prototype of the base object by injecting other values.  Properties on the `Object.prototype` are then inherited by all the JavaScript objects through the prototype chain. When that happens, this leads to either denial of service by triggering JavaScript exceptions, or it tampers with the application source code to force the code path that the attacker injects, thereby leading to remote code execution.\n\nThere are two main ways in which the pollution of prototypes occurs:\n\n-   Unsafe `Object` recursive merge\n    \n-   Property definition by path\n    \n\n### Unsafe Object recursive merge\n\nThe logic of a vulnerable recursive merge function follows the following high-level model:\n```\nmerge (target, source)\n\n  foreach property of source\n\n    if property exists and is an object on both the target and the source\n\n      merge(target[property], source[property])\n\n    else\n\n      target[property] = source[property]\n```\n\u003Cbr>  \n\nWhen the source object contains a property named `__proto__` defined with `Object.defineProperty()` , the condition that checks if the property exists and is an object on both the target and the source passes and the merge recurses with the target, being the prototype of `Object` and the source of `Object` as defined by the attacker. Properties are then copied on the `Object` prototype.\n\nClone operations are a special sub-class of unsafe recursive merges, which occur when a recursive merge is conducted on an empty object: `merge({},source)`.\n\n`lodash` and `Hoek` are examples of libraries susceptible to recursive merge attacks.\n\n### Property definition by path\n\nThere are a few JavaScript libraries that use an API to define property values on an object based on a given path. The function that is generally affected contains this signature: `theFunction(object, path, value)`\n\nIf the attacker can control the value of “path”, they can set this value to `__proto__.myValue`. `myValue` is then assigned to the prototype of the class of the object.\n\n## Types of attacks\n\nThere are a few methods by which Prototype Pollution can be manipulated:\n\n| Type |Origin  |Short description |\n|--|--|--|\n| **Denial of service (DoS)**|Client  |This is the most likely attack. \u003Cbr>DoS occurs when `Object` holds generic functions that are implicitly called for various operations (for example, `toString` and `valueOf`). \u003Cbr> The attacker pollutes `Object.prototype.someattr` and alters its state to an unexpected value such as `Int` or `Object`. In this case, the code fails and is likely to cause a denial of service.  \u003Cbr>**For example:** if an attacker pollutes `Object.prototype.toString` by defining it as an integer, if the codebase at any point was reliant on `someobject.toString()` it would fail. |\n |**Remote Code Execution**|Client|Remote code execution is generally only possible in cases where the codebase evaluates a specific attribute of an object, and then executes that evaluation.\u003Cbr>**For example:** `eval(someobject.someattr)`. In this case, if the attacker pollutes `Object.prototype.someattr` they are likely to be able to leverage this in order to execute code.|\n|**Property Injection**|Client|The attacker pollutes properties that the codebase relies on for their informative value, including security properties such as cookies or tokens.\u003Cbr>  **For example:** if a codebase checks privileges for `someuser.isAdmin`, then when the attacker pollutes `Object.prototype.isAdmin` and sets it to equal `true`, they can then achieve admin privileges.|\n\n## Affected environments\n\nThe following environments are susceptible to a Prototype Pollution attack:\n\n-   Application server\n    \n-   Web server\n\n-   Web browser\n    \n\n## How to prevent\n\n1.  Freeze the prototype— use `Object.freeze (Object.prototype)`.\n    \n2.  Require schema validation of JSON input.\n    \n3.  Avoid using unsafe recursive merge functions.\n    \n4.  Consider using objects without prototypes (for example, `Object.create(null)`), breaking the prototype chain and preventing pollution.\n    \n5.  As a best practice use `Map` instead of `Object`.\n\n### For more information on this vulnerability type:\n\n[Arteau, Olivier. “JavaScript prototype pollution attack in NodeJS application.” GitHub, 26 May 2018](https:\u002F\u002Fgithub.com\u002FHoLyVieR\u002Fprototype-pollution-nsec18\u002Fblob\u002Fmaster\u002Fpaper\u002FJavaScript_prototype_pollution_attack_in_NodeJS.pdf)\n\n## Remediation\nUpgrade `lodash` to version 4.17.5 or higher.\n## References\n- [GitHub Commit](https:\u002F\u002Fgithub.com\u002Flodash\u002Flodash\u002Fcommit\u002Fd8e069cc3410082e44eb18fcf8e7f3d08ebe1d4a)\n- [GitHub PR](https:\u002F\u002Fgithub.com\u002Flodash\u002Flodash\u002Fpull\u002F4337)\n- [HackerOne Report](https:\u002F\u002Fhackerone.com\u002Freports\u002F310443)\n- [NPM Security Advisory](https:\u002F\u002Fwww.npmjs.com\u002Fadvisories\u002F1067)\n- [NPM Security Advisory](https:\u002F\u002Fwww.npmjs.com\u002Fadvisories\u002F1069)\n- [NPM Security Advisory](https:\u002F\u002Fwww.npmjs.com\u002Fadvisories\u002F1070)\n",[236],{"min":14,"max":237},{"version":238,"inclusive":17},"4.17.5",6.3,"2018-02-14T13:22:50Z",{"CVE":242,"CWE":244,"NSP":245,"GHSA":250,"ALTERNATIVE":255},[243],"CVE-2018-3721",[48],[246,247,248,249],"1067","1069","1070","577",[251,252,253,254],"GHSA-2m96-9w4j-wgv7","GHSA-46fh-8fc5-xcwx","GHSA-5947-m4fg-xhqg","GHSA-fvqr-27wr-82fm",[256,233],"SNYK-JS-LODASH-174180",{"Overview":258,"PoC by Olivier Arteau (HoLyVieR)":259,"Details":53,"Types of attacks":54,"Affected environments":55,"How to prevent":56,"Remediation":260,"References":261},"\u003Cp>\u003Ca href=\"https:\u002F\u002Fwww.npmjs.com\u002Fpackage\u002Flodash\">lodash\u003C\u002Fa> is a modern JavaScript utility library delivering modularity, performance, &amp; extras.\u003C\u002Fp>\n\u003Cp>Affected versions of this package are vulnerable to Prototype Pollution. The utilities function allow modification of the \u003Ccode>Object\u00 2F Load the full build.\u003C\u002Fspan>\n\u003Cspan class=\"hljs-keyword\">var\u003C\u002Fspan> _ = \u003Cspan class=\"hljs-built_in\">require\u003C\u002Fspan>(\u003Cspan class=\"hljs-string\">&#x27;lodash&#x27;\u003C\u002Fspan>);\n\u003Cspan class=\"hljs-comment\">\u002F\u002F Load the core build.\u003C\u002Fspan>\n\u003Cspan class=\"hljs-keyword\">var\u003C\u002Fspan> _ = \u003Cspan class=\"hljs-built_in\">require\u003C\u002Fspan>(\u003Cspan class=\"hljs-string\">&#x27;lodash\u002Fcore&#x27;\u003C\u002Fspan>);\n\u003Cspan class=\"hljs-comment\">\u002F\u002F Load the FP build for immutable auto-curried iteratee-first data-last methods.\u003C\u002Fspan>\n\u003Cspan class=\"hljs-keyword\">var\u003C\u002Fspan> fp = \u003Cspan class=\"hljs-built_in\">require\u003C\u002Fspan>(\u003Cspan class=\"hljs-string\">&#x27;lodash\u002Ffp&#x27;\u003C\u002Fspan>);\n\n\u003Cspan class=\"hljs-comment\">\u002F\u002F Load method categories.\u003C\u002Fspan>\n\u003Cspan class=\"hljs-keyword\">var\u003C\u002Fspan> array = \u003Cspan class=\"hljs-built_in\">require\u003C\u002Fspan>(\u003Cspan class=\"hljs-string\">&#x27;lodash\u002Farray&#x27;\u003C\u002Fspan>);\n\u003Cspan class=\"hljs-keyword\">var\u003C\u002Fspan> object = \u003Cspan class=\"hljs-built_in\">require\u003C\u002Fspan>(\u003Cspan class=\"hljs-string\">&#x27;lodash\u002Ffp\u002Fobject&#x27;\u003C\u002Fspan>);\n\n\u003Cspan class=\"hljs-comment\">\u002F\u002F Cherry-pick methods for smaller browserify\u002Frollup\u002Fwebpack bundles.\u003C\u002Fspan>\n\u003Cspan class=\"hljs-keyword\">var\u003C\u002Fspan> at = \u003Cspan class=\"hljs-built_in\">require\u003C\u002Fspan>(\u003Cspan class=\"hljs-string\">&#x27;lodash\u002Fat&#x27;\u003C\u002Fspan>);\n\u003Cspan class=\"hljs-keyword\">var\u003C\u002Fspan> curryN = \u003Cspan class=\"hljs-built_in\">require\u003C\u002Fspan>(\u003Cspan class=\"hljs-string\">&#x27;lodash\u002Ffp\u002FcurryN&#x27;\u003C\u002Fspan>);\n\u003C\u002Fcode>\u003C\u002Fpre>\n\u003Cp>See the \u003Ca href
